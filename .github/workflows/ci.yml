name: CI

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    # Install the package itself (not just its requirements) so the entry
    # points and the packaged GAM data are exercised by the test suite.
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff==0.15.4
        pip install -e ".[dev]"

    - name: Lint with Ruff
      run: |
        # Check formatting
        ruff format --check .
        # Run linter
        ruff check .

    - name: Test with pytest
      run: |
        pytest

  package:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Build sdist and wheel
      run: |
        python -m pip install --upgrade pip build
        python -m build

    - name: Check wheel contents
      run: |
        python - <<'PY'
        import glob
        import zipfile

        wheel = glob.glob("dist/*.whl")[0]
        names = zipfile.ZipFile(wheel).namelist()
        assert not any(n.startswith("tests/") for n in names), "tests leaked into the wheel"
        assert not any(n.startswith("docs/") or n.startswith("docker/") for n in names)
        assert any(n.endswith("models/training_data.csv") for n in names), "GAM data missing"
        print(f"{wheel}: {len(names)} files, contents look correct")
        PY
