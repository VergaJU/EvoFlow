[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evoflow"
version = "0.1.0"
description = "Biological network analysis using MaxFlow min-cut and genetic algorithms"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Jacopo" }
]
dependencies = [
    "numpy>=1.20",
    "pandas>=1.3",
    "scipy>=1.7",
    "networkx>=2.6",
    "scanpy>=1.9",
    "deap>=1.3",
    "matplotlib>=3.5",
    "seaborn>=0.11"
    ]

[project.optional-dependencies]
dev = [
    "ruff>=0.3",
    "pytest>=7.0",
    "pytest-mock>=3.10",
    "pre-commit>=3.0",
]

[project.scripts]
evoflow = "EvoFlow.cli:main"

[project.urls]
Homepage = "https://github.com/jacopo/EvoFlow"
Repository = "https://github.com/jacopo/EvoFlow"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
target-version = "py310"

[tool.ruff.format]
quote-style = "double"