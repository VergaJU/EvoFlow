[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evoflow-bio"
version = "1.0.0"
description = "Biological network analysis using MaxFlow min-cut and genetic algorithms"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Jacopo" }
]
keywords = [
    "bioinformatics",
    "network analysis",
    "maxflow",
    "genetic algorithm",
    "single-cell",
    "gene regulatory network",
    "nichenet",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.20",
    "pandas>=1.3",
    "scipy>=1.7",
    "networkx>=2.6",
    "scanpy>=1.9",
    "deap>=1.3",
    "matplotlib>=3.5",
    "seaborn>=0.11",
    "pyyaml",
    "pygam"]

[project.optional-dependencies]
dev = [
    "ruff>=0.3",
    "pytest>=7.0",
    "pytest-mock>=3.10",
    "pre-commit>=3.0",
]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1.29",
    "myst-nb>=1.1",
    "sphinx-copybutton>=0.5",
]
vignette = [
    "pertpy>=0.10",
    "nichenetpy>=1.0.4",
]

[project.scripts]
evoflow = "EvoFlow.cli:main"

[project.urls]
Homepage = "https://github.com/VergaJU/EvoFlow"
Repository = "https://github.com/VergaJU/EvoFlow"
Issues = "https://github.com/VergaJU/EvoFlow/issues"
Documentation = "https://evoflow.readthedocs.io"
Changelog = "https://github.com/VergaJU/EvoFlow/blob/master/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["EvoFlow*"]
exclude = ["tests*", "docs*", "docker*"]

[tool.ruff]
target-version = "py310"

[tool.ruff.format]
quote-style = "double"

[tool.setuptools.package-data]
"EvoFlow.models" = ["*.pkl", "*.yaml", "*.csv"]
